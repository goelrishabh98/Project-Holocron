name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r resume/requirements.txt

      - name: Render LaTeX from vault data
        run: python resume/build_resume.py --render-only

      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          working_directory: resume
          latexmk_use_xelatex: true

      - name: Upload resume PDF
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: resume/resume.pdf

  build-deploy-site:
    runs-on: ubuntu-latest
    needs: build-resume
    steps:
      - uses: actions/checkout@v4

      - name: Download resume PDF
        uses: actions/download-artifact@v4
        with:
          name: resume-pdf
          path: web/public

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Ensure data/images exists
        run: mkdir -p data/images

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build site
        run: npm run build
        working-directory: web

      # Deploy step — uncomment and configure for your platform:
      #
      # GitHub Pages:
      # - name: Deploy to GitHub Pages
      #   uses: actions/deploy-pages@v4
      #
      # Netlify:
      # - name: Deploy to Netlify
      #   uses: nwtgck/actions-netlify@v3
      #   with:
      #     publish-dir: web/dist
      #     production-deploy: true
      #   env:
      #     NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      #     NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist
